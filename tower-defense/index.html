<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castle Defense</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back" href="../index.html">&larr; All games</a>
  <main id="app">
    <p id="landscape-tip">&#10227; Best in landscape &mdash; turn your phone sideways</p>
    <div id="game-area">
      <canvas id="canvas" width="750" height="500" role="img" aria-label="Castle Defense battlefield: the enemy path to your gate and the towers guarding it. Choose a tower in the sidebar, then click open ground to build."></canvas>
      <div id="overlay" class="hidden">
        <div id="overlay-message"></div>
        <button id="restart-btn">Restart</button>
      </div>
    </div>

    <div id="sidebar">
      <h1>&#127984; Castle Defense</h1>

      <div class="stat-row">
        <span class="stat-label">Gold</span>
        <span id="gold-value" class="stat-value">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Lives</span>
        <span id="lives-value" class="stat-value">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Wave</span>
        <span id="wave-value" class="stat-value">0 / 100</span>
      </div>

      <button id="start-wave-btn">Start Wave</button>

      <h2>Towers</h2>
      <div id="tower-list"></div>

      <h2>Upgrade</h2>
      <div id="upgrade-panel">
        <p class="muted">Tap or click a placed tower to upgrade it.</p>
      </div>

      <p id="hint">Choose a tower to garrison, then tap or click open ground to build it. Defend the gate!</p>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
